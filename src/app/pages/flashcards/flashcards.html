<div class="max-w-[420px] mx-auto px-4 pt-6 pb-10 flex flex-col min-h-screen overflow-hidden">

    <!-- Top bar -->
    <header class="flex items-center justify-between mb-6">
        <button
            (click)="goHome()"
            class="flex items-center gap-1.5 text-sm text-gray-500 hover:text-[#185FA5] transition-colors cursor-pointer">
            <fa-icon [icon]="backIcon" />
            Exit
        </button>
        <span class="text-[13px] text-gray-400">{{ remaining() }} left</span>
    </header>

    @if (currentCard(); as card) {
        <!-- Card stack -->
        <div class="relative flex-1 min-h-[400px]">
            <!-- Stack Background Card (Next Card) -->
            @if (nextCard(); as next) {
                <app-flashcard-card
                    class="pointer-events-none scale-[0.94] translate-y-3 opacity-70 transition-transform duration-200"
                    [card]="next"
                    [script]="script"
                    [answerLang]="answerLang"
                    [pronunciationLang]="pronunciationLang" />
            }

            <!-- Front Interactive Card (Current Card) -->
            @for (c of [card]; track c.id) {
                <app-flashcard-card
                    #activeCard
                    class="z-10"
                    [card]="c"
                    [script]="script"
                    [answerLang]="answerLang"
                    [pronunciationLang]="pronunciationLang"
                    (swiped)="handleSwipe($event)" />
            }
        </div>

        <!-- Action buttons -->
        <div class="flex items-center justify-center gap-6 mt-6">
            <button
                (click)="triggerSwipe('left')"
                class="action-btn action-btn-nope w-14 h-14 rounded-full border border-gray-200 bg-white flex items-center justify-center cursor-pointer transition-colors">
                <fa-icon [icon]="incorrectIcon" />
            </button>
            <button
                (click)="triggerSwipe('right')"
                class="action-btn action-btn-like w-14 h-14 rounded-full border border-gray-200 bg-white flex items-center justify-center cursor-pointer transition-colors">
                <fa-icon [icon]="correctIcon" />
            </button>
        </div>
        <p class="text-[11px] text-center text-gray-400 mt-4">
            Tap the card to flip · swipe right if you knew it, left if you didn't
        </p>
    }

</div>
